<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>เส้นทางส่งของ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --red:#B30000; --ink:#1f2430; --muted:#6b7280; --faint:#9aa1ad; --line:#eceef2; --bg:#f4f5f7; --card:#fff;
    --green:#17a66a; --teal:#0f766e; --blue:#2563c9;
    --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.08);
    --font:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

  .top{flex:0 0 auto;background:linear-gradient(135deg,#7d0000,#B30000 60%,#cf1818);color:#fff;
    padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));box-shadow:0 2px 12px rgba(179,0,0,.28)}
  .top .t{font-weight:800;font-size:16px}
  .top .s{font-size:12px;opacity:.9;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .top .chip{background:rgba(255,255,255,.17);padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px}
  #map{flex:0 0 42vh;min-height:0}
  .list{flex:1 1 auto;overflow:auto;min-height:0;padding:8px 0 4px}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:8px 12px;padding:12px;display:flex;gap:11px}
  .stop .seq{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center}
  .stop .n{min-width:0;flex:1}
  .stop .pr{font-weight:800;font-size:14.5px}
  .stop .pr .cust{font-weight:400;color:var(--muted);font-size:12px}
  .stop .ad{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .stop .tks{font-size:11.5px;color:var(--teal);margin-top:5px;font-weight:700}
  .stop .nav{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:10px;padding:8px 12px;text-decoration:none}
  .stop .nav svg{font-size:15px}
  .note{margin:4px 12px 10px;font-size:11.5px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:11px;padding:10px 12px;line-height:1.5}
  .note b{color:var(--ink)}

  .foot{flex:0 0 auto;padding:10px max(14px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:#fff}
  .gps{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:13px;font-family:inherit;font-size:15px;font-weight:800;padding:14px;cursor:pointer;background:var(--teal);color:#fff}
  .gps.on{background:#fdeceb;color:var(--red)}
  .gps svg{font-size:19px}
  .gpshint{text-align:center;font-size:11px;color:var(--faint);margin-top:6px}

  .leaflet-container{background:#e9edf1;font-family:var(--font)}
  .wh-ic{display:grid;place-items:center;color:#fff;background:var(--red);width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .wh-ic svg{transform:rotate(-45deg);font-size:14px}
  .stopnum{background:var(--teal);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .me-ic{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,201,.3)}
  .mid{flex:1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:30px 20px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);z-index:2000;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:22px;opacity:0;transition:.22s;pointer-events:none;max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="top">
    <div class="t">เส้นทางส่งของ</div>
    <div class="s" id="sub">กำลังโหลด…</div>
  </div>
  <div id="map"></div>
  <div class="list" id="list"><div class="mid">กำลังโหลดเส้นทาง…</div></div>
  <div class="foot">
    <button class="gps" id="gps"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="gpst">แชร์ตำแหน่งให้หัวหน้าเห็น</span></button>
    <div class="gpshint" id="gpshint">เปิดแล้วหัวหน้าจะเห็นรถคุณบนแผนที่ · ปิดได้ทุกเมื่อ</div>
  </div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},2400)}
  var q=new URLSearchParams(location.search), TRIP=q.get("trip")||"", TK=q.get("t")||"";

  var map=L.map("map",{zoomControl:true}).setView([13.74,100.45],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  function whIcon(){return L.divIcon({className:"",html:'<div class="wh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5 9v11h14V9"/></svg></div>',iconSize:[28,28],iconAnchor:[14,25]});}

  function navUrl(lat,lng){return "https://www.google.com/maps/dir/?api=1&destination="+lat+","+lng;}

  function render(trip){
    // จัดกลุ่มรายแทรคเป็นจุด (ตาม seq) — PR เดียว/ที่เดียว = 1 จุด
    var stops=[], byKey={};
    (trip.stops||[]).slice().sort(function(a,b){return (a.seq||0)-(b.seq||0)}).forEach(function(s){
      var k=s.pr||s.tracking; if(!byKey[k]){byKey[k]={pr:s.pr,customer:s.customer,address:s.address,lat:+s.lat,lng:+s.lng,tks:[]};stops.push(byKey[k]);} byKey[k].tks.push(s.tracking);
    });
    var sub=$("sub"); sub.innerHTML='<span class="chip">'+esc(trip.name||"เที่ยว")+'</span>'+
      (trip.truck?'<span class="chip">🚛 '+esc(trip.truck.name||"")+(trip.truck.driver_name?' · '+esc(trip.truck.driver_name):'')+'</span>':'')+
      '<span class="chip">'+stops.length+' จุด</span>';
    var el=$("list"); el.innerHTML="";
    if(!stops.length){el.innerHTML='<div class="mid">เที่ยวนี้ยังไม่มีจุดส่ง</div>';}
    var pts=[], line=[]; var o=trip.origin;
    if(o&&o.lat){ L.marker([o.lat,o.lng],{icon:whIcon(),zIndexOffset:1000}).addTo(map).bindPopup("โกดัง PACRED (จุดเริ่ม)"); pts.push([o.lat,o.lng]); line.push([o.lat,o.lng]); }
    stops.forEach(function(s,i){
      if(s.lat){ L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:'<div class="stopnum">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindPopup('<b>จุดที่ '+(i+1)+' · '+esc(s.pr||"")+'</b>'); pts.push([s.lat,s.lng]); line.push([s.lat,s.lng]); }
      var card=document.createElement("div"); card.className="stop";
      card.innerHTML='<div class="seq">'+(i+1)+'</div><div class="n"><div class="pr">'+esc(s.pr||"จุด")+(s.customer?' <span class="cust">'+esc(s.customer)+'</span>':'')+'</div>'+
        (s.address?'<div class="ad">'+esc(s.address)+'</div>':'')+
        '<div class="tks">แทรค: '+esc(s.tks.filter(Boolean).join(", ")||"-")+'</div>'+
        (s.lat?'<a class="nav" target="_blank" rel="noopener" href="'+navUrl(s.lat,s.lng)+'"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2Z"/></svg>นำทาง</a>':'')+'</div>';
      el.appendChild(card);
    });
    var note=document.createElement("div"); note.className="note";
    note.innerHTML='📍 นี่คือ<b>เส้นทางที่หัวหน้าวางไว้</b> (ดูอย่างเดียว) · การ<b>อัปเดตสถานะส่ง / แนบรูปหลักฐาน</b> ให้ทำในระบบ Pacred ตามปกติ';
    el.appendChild(note);
    if(o&&o.lat&&line.length>1){line.push([o.lat,o.lng]); L.polyline(line,{color:"#0f766e",weight:4,opacity:.7,dashArray:"7,7"}).addTo(map);}
    if(pts.length)setTimeout(function(){map.invalidateSize();map.fitBounds(pts,{padding:[40,40],maxZoom:14})},200);
  }

  if(!TRIP||!TK){ $("list").innerHTML='<div class="mid">ลิงก์ไม่ถูกต้อง — ขอลิงก์ใหม่จากหัวหน้า</div>'; $("sub").textContent="ลิงก์ไม่ถูกต้อง"; $("gps").disabled=true; return; }
  fetch("/delivery/api/driver/trip?trip="+encodeURIComponent(TRIP)+"&t="+encodeURIComponent(TK))
    .then(function(r){return r.json().then(function(j){return r.ok?j:Promise.reject(j)})})
    .then(function(r){ render(r.trip); })
    .catch(function(e){ $("list").innerHTML='<div class="mid">'+esc((e&&e.error)||"เปิดเที่ยวไม่ได้")+'</div>'; $("sub").textContent="เปิดไม่ได้"; });

  // ---- แชร์ GPS ----
  var watch=null, meMarker=null, lastPing=0;
  function stopGps(){ if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;} $("gps").classList.remove("on"); $("gpst").textContent="แชร์ตำแหน่งให้หัวหน้าเห็น"; $("gpshint").textContent="เปิดแล้วหัวหน้าจะเห็นรถคุณบนแผนที่ · ปิดได้ทุกเมื่อ"; }
  function startGps(){
    if(!navigator.geolocation){toast("มือถือนี้ไม่รองรับ GPS");return;}
    $("gps").classList.add("on"); $("gpst").textContent="กำลังแชร์ตำแหน่ง… (แตะเพื่อหยุด)"; $("gpshint").textContent="เปิดหน้านี้ค้างไว้ระหว่างขับ หัวหน้าจะเห็นตำแหน่งล่าสุด";
    watch=navigator.geolocation.watchPosition(function(p){
      var lat=p.coords.latitude, lng=p.coords.longitude;
      if(!meMarker){meMarker=L.marker([lat,lng],{icon:L.divIcon({className:"",html:'<div class="me-ic"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1500}).addTo(map).bindPopup("ตำแหน่งคุณ");}
      else meMarker.setLatLng([lat,lng]);
      var now=Date.now(); if(now-lastPing<10000)return; lastPing=now; // ส่งไม่ถี่เกิน 10 วิ
      fetch("/delivery/api/driver/ping",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({trip:TRIP,t:TK,lat:lat,lng:lng})}).catch(function(){});
    },function(err){ stopGps(); toast(err&&err.code===1?"ไม่ได้อนุญาตให้ใช้ตำแหน่ง":"อ่านตำแหน่งไม่ได้"); },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
  $("gps").addEventListener("click",function(){ if(watch!=null)stopGps(); else startGps(); });
})();
</script>
</body>
</html>
