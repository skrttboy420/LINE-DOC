<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>เส้นทางส่งของ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --red:#B30000; --ink:#1f2430; --muted:#6b7280; --faint:#9aa1ad; --line:#eceef2; --bg:#f4f5f7; --card:#fff;
    --green:#17a66a; --teal:#0f766e; --blue:#2563c9;
    --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.08);
    --font:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

  .top{flex:0 0 auto;background:linear-gradient(135deg,#7d0000,#B30000 60%,#cf1818);color:#fff;
    padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));box-shadow:0 2px 12px rgba(179,0,0,.28)}
  .top .t{font-weight:800;font-size:16px}
  .top .s{font-size:12px;opacity:.9;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .top .chip{background:rgba(255,255,255,.17);padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px}
  #map{flex:0 0 42vh;min-height:0}
  .list{flex:1 1 auto;overflow:auto;min-height:0;padding:8px 0 4px}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:8px 12px;padding:12px;display:flex;gap:11px}
  .stop .seq{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center}
  .stop .n{min-width:0;flex:1}
  .stop .pr{font-weight:800;font-size:14.5px}
  .stop .pr .cust{font-weight:400;color:var(--muted);font-size:12px}
  .stop .ad{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .stop .tks{font-size:11.5px;color:var(--teal);margin-top:5px;font-weight:700}
  .stop .nav{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:10px;padding:8px 12px;text-decoration:none}
  .stop .nav svg{font-size:15px}
  /* 📍 ปุ่มปักหมุด (ภูม 2026-11-25) — แดง = จุดนี้ยังไม่มีหมุด · เทา = มีแล้วแต่แก้ได้ */
  .stop .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .stop .acts .nav{margin-top:0}
  .stop .pinbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 12px;
    font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
  .stop .pinbtn.need{background:#d8352a;color:#fff}
  .stop .pinbtn.has{background:#eef0f4;color:var(--muted)}
  .stop .pinbtn svg{font-size:15px}
  .stop .warn{margin-top:6px;font-size:11.5px;font-weight:800;color:#d8352a}

  /* แผ่นยืนยัน — กันกดลั่นแล้วทับที่อยู่ลูกค้า (ทรงเดียวกับ popup ของปุ่มในเว็บ Pacred) */
  .sheet{position:fixed;inset:0;z-index:3000;background:rgba(18,22,34,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .box{background:#fff;width:min(560px,100%);max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .sheet .hd{flex:0 0 auto;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:800}
  .sheet .hd .x{margin-left:auto;border:0;background:var(--bg);color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:17px;line-height:1}
  .sheet .bd{flex:1 1 auto;overflow:auto;padding:13px 15px;font-size:13.5px;line-height:1.6}
  .sheet .bd .k{color:var(--muted);font-size:12px}
  .sheet .bd .v{font-weight:800}
  .sheet .bd .row{padding:7px 0;border-bottom:1px solid #f4f5f7}
  .sheet .bd .row:last-child{border-bottom:0}
  .sheet .bd .acc{font-size:12px;color:var(--muted)}
  .sheet .bd .acc.bad{color:#d8352a;font-weight:800}
  .sheet .ft{flex:0 0 auto;padding:11px 15px calc(env(safe-area-inset-bottom,0px) + 13px);border-top:1px solid var(--line);display:flex;gap:9px}
  .sheet .ft button{flex:1;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer}
  .sheet .ft .go{background:var(--teal);color:#fff}
  .sheet .ft .go:disabled{opacity:.55}
  .sheet .ft .no{background:var(--bg);color:var(--muted);flex:0 0 100px}
  .sheet a.chk{display:inline-block;margin-top:8px;color:var(--blue);font-weight:800;font-size:12.5px}
  .note{margin:4px 12px 10px;font-size:11.5px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:11px;padding:10px 12px;line-height:1.5}
  .note b{color:var(--ink)}

  .foot{flex:0 0 auto;padding:10px max(14px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--line);background:#fff}
  .gps{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:13px;font-family:inherit;font-size:15px;font-weight:800;padding:14px;cursor:pointer;background:var(--teal);color:#fff}
  .gps.on{background:#fdeceb;color:var(--red)}
  .gps svg{font-size:19px}
  .gpshint{text-align:center;font-size:11px;color:var(--faint);margin-top:6px}

  .leaflet-container{background:#e9edf1;font-family:var(--font)}
  .wh-ic{display:grid;place-items:center;color:#fff;background:var(--red);width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .wh-ic svg{transform:rotate(-45deg);font-size:14px}
  .stopnum{background:var(--teal);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .me-ic{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,201,.3)}
  .mid{flex:1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:30px 20px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);z-index:2000;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:22px;opacity:0;transition:.22s;pointer-events:none;max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="top">
    <div class="t">เส้นทางส่งของ</div>
    <div class="s" id="sub">กำลังโหลด…</div>
  </div>
  <div id="map"></div>
  <div class="list" id="list"><div class="mid">กำลังโหลดเส้นทาง…</div></div>
  <div class="foot">
    <button class="gps" id="gps"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="gpst">แชร์ตำแหน่งให้หัวหน้าเห็น</span></button>
    <div class="gpshint" id="gpshint">เปิดแล้วหัวหน้าจะเห็นรถคุณบนแผนที่ · ปิดได้ทุกเมื่อ</div>
  </div>
<div class="toast" id="toast"></div>
<!-- 📍 ภูม 2026-11-25: *"ถ้าคนขับไปถึงบ้านลูกค้าจริงๆแล้ว ทำปุ่มให้คนขับปักหมุดกลับมาด้วยได้ไหม"* -->
<div class="sheet" id="pinsheet">
  <div class="box">
    <div class="hd"><span>📍 ปักหมุดหน้าบ้านลูกค้า</span><button class="x" id="pinX" type="button">✕</button></div>
    <div class="bd" id="pinBd"></div>
    <div class="ft"><button class="no" id="pinNo" type="button">ยกเลิก</button><button class="go" id="pinGo" type="button">ยืนยันปักหมุดตรงนี้</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},2400)}
  var q=new URLSearchParams(location.search), TRIP=q.get("trip")||"", TK=q.get("t")||"";

  var map=L.map("map",{zoomControl:true}).setView([13.74,100.45],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  function whIcon(){return L.divIcon({className:"",html:'<div class="wh-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5 9v11h14V9"/></svg></div>',iconSize:[28,28],iconAnchor:[14,25]});}

  function navUrl(lat,lng){return "https://www.google.com/maps/dir/?api=1&destination="+lat+","+lng;}

  /**
   * วาดเนื้อการ์ด 1 จุด — แยกออกมาเพราะต้องวาดใหม่หลังปักหมุดเสร็จ
   * (ไม่ต้องรีโหลดหน้า คนขับจะได้ไม่ต้องเปิดแชร์ตำแหน่งใหม่)
   */
  function drawStop(s){
    var n=s.card.querySelector(".n");
    var nav = s.lat ? '<a class="nav" target="_blank" rel="noopener" href="'+navUrl(s.lat,s.lng)+'"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2Z"/></svg>นำทาง</a>' : "";
    /* ยังไม่มีหมุด = ปุ่มแดงเด่น · มีแล้ว = ปุ่มเทา (กดแก้ได้ถ้าหมุดพาไปผิดบ้าน) */
    var pin = '<button type="button" class="pinbtn '+(s.lat?"has":"need")+'" data-pin="'+s.seq+'">'+
      '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>'+
      (s.lat?"หมุดไม่ตรง? ปักใหม่":"ปักหมุดที่นี่")+'</button>';
    n.innerHTML='<div class="pr">'+esc(s.pr||"จุด")+(s.customer?' <span class="cust">'+esc(s.customer)+'</span>':'')+'</div>'+
      (s.address?'<div class="ad">'+esc(s.address)+'</div>':'')+
      '<div class="tks">แทรค: '+esc(s.tks.filter(Boolean).join(", ")||"-")+'</div>'+
      (s.lat?"":'<div class="warn">⚠ จุดนี้ยังไม่มีหมุด — ถึงหน้าบ้านแล้วช่วยกดปักให้ด้วยนะครับ</div>')+
      '<div class="acts">'+nav+pin+'</div>';
    n.querySelector("[data-pin]").addEventListener("click",function(){ openPin(s); });
  }

  /* ── 📍 ปักหมุด: ขอ GPS → โชว์ให้ดูก่อน → กดยืนยันถึงบันทึก ──────────
     ลำดับนี้จงใจให้เหมือนปุ่มในเว็บ Pacred — ไม่มีทางที่กดปุ่มเดียวแล้ว
     เขียนทับที่อยู่ลูกค้าเลย เพราะพิกัดนี้จะถูกใช้นำทางในรอบถัดๆ ไปด้วย */
  var pinStop=null, pinFix=null;
  function closePin(){ $("pinsheet").classList.remove("on"); pinStop=null; pinFix=null; }
  function openPin(s){
    pinStop=s; pinFix=null;
    $("pinsheet").classList.add("on");
    $("pinGo").disabled=true;
    $("pinBd").innerHTML='<div class="row">กำลังอ่านตำแหน่งจาก GPS…</div>';
    if(!navigator.geolocation){ $("pinBd").innerHTML='<div class="row">มือถือนี้ไม่รองรับ GPS</div>'; return; }
    navigator.geolocation.getCurrentPosition(function(p){
      pinFix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      var acc=Math.round(pinFix.acc||0), bad=acc>50;
      $("pinBd").innerHTML=
        '<div class="row"><div class="k">ปักให้</div><div class="v">'+esc(s.pr||"")+(s.customer?" · "+esc(s.customer):"")+'</div></div>'+
        '<div class="row"><div class="k">ที่อยู่ที่ระบบมีตอนนี้</div><div>'+esc(s.address||"— ไม่มี —")+'</div></div>'+
        '<div class="row"><div class="k">พิกัดที่คุณยืนอยู่</div><div class="v">'+pinFix.lat.toFixed(6)+", "+pinFix.lng.toFixed(6)+'</div>'+
          '<div class="acc'+(bad?" bad":"")+'">แม่นยำประมาณ '+acc+' เมตร'+(bad?" — ยังไม่ค่อยแม่น ลองออกมาที่โล่งแล้วกดใหม่ได้":"")+'</div>'+
          '<a class="chk" target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+pinFix.lat+","+pinFix.lng+'">เปิด Google Maps ดูก่อนว่าใช่บ้านนี้ไหม →</a></div>'+
        '<div class="row" style="color:#6b7280;font-size:12px">กดยืนยันแล้ว ที่อยู่ของลูกค้ารายนี้จะใช้พิกัดนี้นำทางในรอบถัดไปด้วย</div>';
      $("pinGo").disabled=false;
    },function(err){
      $("pinBd").innerHTML='<div class="row">'+(err&&err.code===1?"ไม่ได้อนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ก่อนนะครับ":"อ่านตำแหน่งไม่ได้ ลองออกมาที่โล่งแล้วกดใหม่")+'</div>';
    },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  }
  $("pinX").addEventListener("click",closePin);
  $("pinNo").addEventListener("click",closePin);
  $("pinsheet").addEventListener("click",function(e){ if(e.target===this) closePin(); });
  $("pinGo").addEventListener("click",function(){
    if(!pinStop||!pinFix)return;
    var s=pinStop, fix=pinFix, btn=this;
    btn.disabled=true; btn.textContent="กำลังบันทึก…";
    fetch("/delivery/api/driver/pin",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({trip:TRIP,t:TK,trackings:s.tks.filter(Boolean),lat:fix.lat,lng:fix.lng,accuracyM:fix.acc})})
      .then(function(r){return r.json().then(function(j){return r.ok?j:Promise.reject(j)})})
      .then(function(){
        btn.disabled=false; btn.textContent="ยืนยันปักหมุดตรงนี้";
        /* อัปของบนจอทันที — การ์ด + หมุดบนแผนที่ (ไม่ต้องรีโหลด) */
        s.lat=fix.lat; s.lng=fix.lng;
        if(s.marker) s.marker.setLatLng([s.lat,s.lng]);
        else s.marker=L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:'<div class="stopnum">'+s.seq+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindPopup('<b>จุดที่ '+s.seq+'</b>');
        drawStop(s);
        closePin(); toast("ปักหมุดให้ "+(s.pr||"จุดนี้")+" แล้ว ✓");
      })
      .catch(function(e){
        btn.disabled=false; btn.textContent="ยืนยันปักหมุดตรงนี้";
        toast((e&&e.error)||"ปักหมุดไม่สำเร็จ");
      });
  });

  function render(trip){
    // จัดกลุ่มรายแทรคเป็นจุด (ตาม seq) — PR เดียว/ที่เดียว = 1 จุด
    var stops=[], byKey={};
    (trip.stops||[]).slice().sort(function(a,b){return (a.seq||0)-(b.seq||0)}).forEach(function(s){
      var k=s.pr||s.tracking; if(!byKey[k]){byKey[k]={pr:s.pr,customer:s.customer,address:s.address,lat:+s.lat,lng:+s.lng,tks:[]};stops.push(byKey[k]);} byKey[k].tks.push(s.tracking);
    });
    var sub=$("sub"); sub.innerHTML='<span class="chip">'+esc(trip.name||"เที่ยว")+'</span>'+
      (trip.truck?'<span class="chip">🚛 '+esc(trip.truck.name||"")+(trip.truck.driver_name?' · '+esc(trip.truck.driver_name):'')+'</span>':'')+
      '<span class="chip">'+stops.length+' จุด</span>';
    var el=$("list"); el.innerHTML="";
    if(!stops.length){el.innerHTML='<div class="mid">เที่ยวนี้ยังไม่มีจุดส่ง</div>';}
    var pts=[], line=[]; var o=trip.origin;
    if(o&&o.lat){ L.marker([o.lat,o.lng],{icon:whIcon(),zIndexOffset:1000}).addTo(map).bindPopup("โกดัง PACRED (จุดเริ่ม)"); pts.push([o.lat,o.lng]); line.push([o.lat,o.lng]); }
    stops.forEach(function(s,i){
      if(s.lat){ s.marker=L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:'<div class="stopnum">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindPopup('<b>จุดที่ '+(i+1)+' · '+esc(s.pr||"")+'</b>'); pts.push([s.lat,s.lng]); line.push([s.lat,s.lng]); }
      var card=document.createElement("div"); card.className="stop"; s.card=card; s.seq=i+1;
      card.innerHTML='<div class="seq">'+(i+1)+'</div><div class="n"></div>';
      drawStop(s);
      el.appendChild(card);
    });
    var note=document.createElement("div"); note.className="note";
    note.innerHTML='📍 นี่คือ<b>เส้นทางที่หัวหน้าวางไว้</b> · ถึงหน้าบ้านลูกค้าแล้วกด <b>ปักหมุดที่นี่</b> ได้เลย ระบบจะจำที่อยู่จริงไว้ให้รอบหน้า · การ<b>อัปเดตสถานะส่ง / แนบรูปหลักฐาน</b> ให้ทำในระบบ Pacred ตามปกติ';
    el.appendChild(note);
    if(o&&o.lat&&line.length>1){line.push([o.lat,o.lng]); L.polyline(line,{color:"#0f766e",weight:4,opacity:.7,dashArray:"7,7"}).addTo(map);}
    if(pts.length)setTimeout(function(){map.invalidateSize();map.fitBounds(pts,{padding:[40,40],maxZoom:14})},200);
  }

  if(!TRIP||!TK){ $("list").innerHTML='<div class="mid">ลิงก์ไม่ถูกต้อง — ขอลิงก์ใหม่จากหัวหน้า</div>'; $("sub").textContent="ลิงก์ไม่ถูกต้อง"; $("gps").disabled=true; return; }
  fetch("/delivery/api/driver/trip?trip="+encodeURIComponent(TRIP)+"&t="+encodeURIComponent(TK))
    .then(function(r){return r.json().then(function(j){return r.ok?j:Promise.reject(j)})})
    .then(function(r){ render(r.trip); })
    .catch(function(e){ $("list").innerHTML='<div class="mid">'+esc((e&&e.error)||"เปิดเที่ยวไม่ได้")+'</div>'; $("sub").textContent="เปิดไม่ได้"; });

  // ---- แชร์ GPS ----
  /* 🔴 ภูม 2026-11-28: *"แชร์แล้วหมุดไม่เห็นขยับตามเลยอะ มันค้างที่จุดนั้นเลย"*
     3 ต้นเหตุที่เจอตอนอ่านโค้ดเดิม:
     ① error ของ watchPosition **ตัวไหนก็ได้** เรียก stopGps() ⇒ เข้าอุโมงค์/ใต้ตึก/สัญญาณหาย
        ครบ timeout ครั้งเดียว (code 3) = หยุดแชร์ถาวร · มือถืออยู่ในกระเป๋า คนขับไม่มีทางรู้
        ⇒ หยุดเฉพาะ "ไม่อนุญาต" (code 1) · นอกนั้นแค่บอกว่ากำลังหาสัญญาณ แล้วแชร์ต่อ
     ② กันส่งถี่ 10 วิ เป็นแบบทิ้งอันที่มาเร็วเกิน และไม่มีตัวส่งตาม ⇒ จุดสุดท้ายหล่นหายประจำ
        ⇒ เพิ่มหัวใจเต้น ส่งจุดล่าสุดซ้ำทุก 25 วิ (จอดไฟแดงนานๆ หัวหน้าก็ยังรู้ว่ารถยังอยู่)
     ③ ส่งไม่ออกแล้ว .catch เงียบ ⇒ ไม่มีใครรู้ว่าพัง · ตอนนี้ขึ้นบนจอคนขับ + นับจำนวนครั้งที่ส่งแล้ว
     🔋 ขอ Wake Lock ด้วย — จอดับเมื่อไหร่ ระบบพัก watchPosition ทันที (เครื่องไหนไม่รองรับก็ข้าม) */
  var watch=null, meMarker=null, lastPing=0, lastFix=null, beat=null, sent=0, wake=null;
  function gpsHint(t){ $("gpshint").textContent=t; }
  function keepAwake(){
    if(!(navigator.wakeLock&&navigator.wakeLock.request))return;
    try{ navigator.wakeLock.request("screen").then(function(w){wake=w},function(){}); }catch(e){}
  }
  function sendFix(fix){
    if(!fix)return;
    lastPing=Date.now();
    fetch("/delivery/api/driver/ping",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({trip:TRIP,t:TK,lat:fix.lat,lng:fix.lng})})
      .then(function(r){ return r.ok?r.json():r.json().catch(function(){return{}}).then(function(j){return Promise.reject(j)}); })
      .then(function(){ sent++; gpsHint("✓ ส่งตำแหน่งให้หัวหน้าแล้ว "+sent+" ครั้ง · ล่าสุดเมื่อกี้"); })
      .catch(function(e){ gpsHint("⚠️ ส่งไม่ออก ("+((e&&e.error)||"เน็ตหลุด?")+") — ยังแชร์อยู่ เดี๋ยวลองใหม่ให้เอง"); });
  }
  function stopGps(){
    if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;}
    if(beat){clearInterval(beat);beat=null;}
    if(wake&&wake.release){try{wake.release()}catch(e){} }
    wake=null;
    $("gps").classList.remove("on"); $("gpst").textContent="แชร์ตำแหน่งให้หัวหน้าเห็น";
    gpsHint("เปิดแล้วหัวหน้าจะเห็นรถคุณบนแผนที่ · ปิดได้ทุกเมื่อ");
  }
  function startGps(){
    if(!navigator.geolocation){toast("มือถือนี้ไม่รองรับ GPS");return;}
    sent=0; lastFix=null; lastPing=0;
    $("gps").classList.add("on"); $("gpst").textContent="กำลังแชร์ตำแหน่ง… (แตะเพื่อหยุด)";
    gpsHint("กำลังหาสัญญาณ GPS…");
    keepAwake();
    watch=navigator.geolocation.watchPosition(function(p){
      var fix={lat:p.coords.latitude,lng:p.coords.longitude};
      lastFix=fix;
      if(!meMarker){meMarker=L.marker([fix.lat,fix.lng],{icon:L.divIcon({className:"",html:'<div class="me-ic"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1500}).addTo(map).bindPopup("ตำแหน่งคุณ");}
      else meMarker.setLatLng([fix.lat,fix.lng]);
      if(Date.now()-lastPing<10000)return;   /* ไม่ส่งถี่เกิน 10 วิ — ที่ทิ้งไป หัวใจเต้นส่งตามให้ */
      sendFix(fix);
    },function(err){
      /* ไม่อนุญาต = จบจริง · นอกนั้น (หมดเวลา/หาสัญญาณไม่เจอ) ห้ามหยุด เดี๋ยวสัญญาณกลับมาก็ไปต่อ */
      if(err&&err.code===1){ stopGps(); toast("ไม่ได้อนุญาตให้ใช้ตำแหน่ง"); return; }
      gpsHint("⚠️ สัญญาณ GPS หายชั่วคราว — ยังแชร์อยู่ กำลังหาใหม่"+(sent?" · ส่งไปแล้ว "+sent+" ครั้ง":""));
    },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    /* 💓 หัวใจเต้น — จอดนิ่งนานๆ GPS ไม่ยิงจุดใหม่ ก็ส่งจุดเดิมซ้ำ ให้หัวหน้ารู้ว่ารถยังวิ่งงานอยู่ */
    beat=setInterval(function(){ if(lastFix&&Date.now()-lastPing>=25000) sendFix(lastFix); },5000);
  }
  /* สลับแอปแล้วกลับมา = ระบบคืน Wake Lock ให้เอง ต้องขอใหม่ */
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&watch!=null&&!wake) keepAwake();
  });
  $("gps").addEventListener("click",function(){ if(watch!=null)stopGps(); else startGps(); });
})();
</script>
</body>
