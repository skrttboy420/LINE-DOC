<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ป้ายโลเคชั่น — โกดัง Pacred</title>
<!--
  🖨 ป้ายโลเคชั่นสำหรับติดชั้นวาง — ภูม 2026-11-12
  *"ในกระดาษที่ปริ้นมาต้องมีบาร์โค้ดที่ยิงแล้วก็ขึ้นล็อกนั้นๆนะ"*
  *"บาโค้ดที่พิมพ์มันเล็กไป ช่วยขยายให้มันใหญ่ขึ้นอีกนิด"* (รอบ 2)
  *"เพิ่ม QR โค้ดมาด้วย เพื่อที่มือถือที่ไม่ใช่เครื่องสแกนสามารถสแกนผ่าน QR เพื่อเลือกล็อกได้"*

  ป้ายหนึ่งใบมี 2 อย่าง เก็บ "ข้อความเดียวกัน" = รหัสช่อง (เช่น A0101-L)
    ▌▌▌ บาร์โค้ด Code128 → เครื่องยิงบาร์โค้ด
    ▓▓▓ QR               → กล้องมือถือ (หน้า "ยิงรับเข้าชั้น" → ปุ่ม 📷 เปิดกล้อง)
  🔒 ป้ายไม่มีกุญแจเข้าระบบอยู่ในนั้น — กระดาษหลุดไปก็เปิดระบบไม่ได้

  📐 ขนาดคิดเป็นมิลลิเมตรจริง (A4 แนวตั้ง ขอบ 8 มม. = พื้นที่ 194 × 281 มม.)
     ⇒ ที่เห็นบนจอ = ที่ได้บนกระดาษ · จำนวนแผ่นที่บอกไว้ตรงจริง
-->
<style>
  :root{--red:#B30000;--line:#e5e7eb;--muted:#6b7280;
        --cols:2;--lh:42mm;--qr:26mm;--bc:17mm;--code:9mm}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
       background:#f1f5f9;color:#111}

  /* ── แถบตั้งค่า (ไม่พิมพ์) ── */
  .bar{background:var(--red);color:#fff;padding:11px 14px;display:flex;gap:10px;
       align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .bar b{font-size:16px}
  .bar .sub{font-size:11px;opacity:.85}
  .bar select,.bar button,.bar a{font-family:inherit;font-size:13px;border-radius:8px;
       border:0;padding:8px 12px;cursor:pointer;text-decoration:none}
  .bar select{background:#fff;color:#111}
  .bar .go{background:#fff;color:var(--red);font-weight:700}
  .bar a{background:rgba(255,255,255,.2);color:#fff}
  .bar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .note{max-width:760px;margin:14px auto 0;padding:0 14px;color:var(--muted);font-size:12.5px;line-height:1.75}

  /* ── แผ่นป้าย — กว้างเท่ากระดาษ A4 จริง ── */
  #wrap{overflow-x:auto;padding:14px 14px 30px}
  #sheet{width:194mm;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4mm}
  .lbl{background:#fff;border:1px solid #cbd5e1;border-radius:2mm;padding:2.5mm;
       height:var(--lh);display:flex;flex-direction:column;text-align:center;
       break-inside:avoid;page-break-inside:avoid}
  .lbl .zone{font-size:2.6mm;color:var(--muted);letter-spacing:.2px;line-height:1.2}
  .lbl .code{font-family:ui-monospace,Menlo,monospace;font-size:var(--code);font-weight:800;
       letter-spacing:.5mm;line-height:1.1;margin:.6mm 0 1mm}
  .lbl .marks{flex:1;display:flex;align-items:center;gap:2mm;min-height:0}
  .lbl .marks .bc{flex:1;min-width:0;display:flex;align-items:center}
  .lbl .marks .bc svg{width:100%;height:var(--bc);display:block}
  .lbl .marks .qr{width:var(--qr);height:var(--qr);flex:none}
  .lbl .marks .qr svg{width:100%;height:100%;display:block}
  .lbl .foot{font-size:2.4mm;color:var(--muted);margin-top:.8mm;line-height:1.2}
  .bad{font-size:2.6mm;color:#b91c1c}
  .empty{background:#fff;border:1px dashed #cbd5e1;border-radius:10px;padding:26px;text-align:center;color:var(--muted)}

  @media print{
    .bar,.note{display:none!important}
    body{background:#fff}
    #wrap{overflow:visible;padding:0}
    #sheet{width:auto;margin:0}
    .lbl{border:1px solid #94a3b8;border-radius:0}
    @page{size:A4 portrait;margin:8mm}
  }
</style>
</head>
<body>
<div class="bar">
  <div><b>🖨 ป้ายโลเคชั่น</b><div class="sub">ติดที่ชั้นวาง — ยิงบาร์โค้ด หรือสแกน QR ด้วยมือถือ</div></div>
  <div class="sp">
    <select id="row"><option value="">ทุกโซน</option></select>
    <select id="bay"><option value="">ทุกล็อก</option></select>
    <select id="size">
      <option value="2">ขนาดใหญ่ — 2 ป้าย/แถว</option>
      <option value="3">ขนาดกลาง — 3 ป้าย/แถว</option>
      <option value="4">ขนาดเล็ก — 4 ป้าย/แถว</option>
    </select>
    <select id="mode">
      <option value="slot">ป้ายต่อช่องวาง (ซ้าย/ขวาแยกกัน)</option>
      <option value="cell">ป้ายต่อช่องชั้น (ไม่แยกซ้าย/ขวา)</option>
    </select>
    <button class="go" id="print">🖨 พิมพ์</button>
    <a id="back" href="#">← กลับ</a>
  </div>
</div>

<div class="note" id="note"></div>
<div id="wrap"><div id="sheet"><div class="empty">กำลังโหลดผังโกดัง…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.js"></script>
<script type="module">
const KEY = new URLSearchParams(location.search).get("key") || "";
const api = (p) => p + (p.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("back").href = api("/warehouse/scan");

/* 📐 ขนาดป้าย — คิดจากกระดาษจริง A4 แนวตั้ง ขอบ 8 มม. (พื้นที่ 194 × 281 มม.)
      ป้าย/แผ่น = floor((281 + ช่องไฟ) / (สูงป้าย + ช่องไฟ)) × จำนวนคอลัมน์ */
const GAP = 4;                                    // ช่องไฟระหว่างป้าย (มม.)
const PAGE_W = 194;                               // กว้างพื้นที่พิมพ์ (มม.)
const PAGE_H = 281;                               // สูงพื้นที่พิมพ์ (มม.)
const SIZES = {
  2: { cols: 2, lh: 42, qr: 26, bc: 17, code: 9 },
  3: { cols: 3, lh: 34, qr: 20, bc: 13, code: 7 },
  4: { cols: 4, lh: 28, qr: 15, bc: 10, code: 5.4 },
};
const labelW = (s) => (PAGE_W - GAP * (s.cols - 1)) / s.cols;
const perSheet = (s) => Math.floor((PAGE_H + GAP) / (s.lh + GAP)) * s.cols;

let LAYOUT = null;

function sizeNow() { return SIZES[$("size").value] || SIZES[2]; }
function applySize() {
  const s = sizeNow(), r = document.documentElement.style;
  r.setProperty("--cols", String(s.cols));
  r.setProperty("--lh", s.lh + "mm");
  r.setProperty("--qr", s.qr + "mm");
  r.setProperty("--bc", s.bc + "mm");
  r.setProperty("--code", s.code + "mm");
}

function rowsOf() { return LAYOUT ? LAYOUT.rows : []; }

function fillPickers() {
  $("row").innerHTML = '<option value="">ทุกโซน</option>' +
    rowsOf().map((r) => '<option value="' + r.key + '">' + esc(r.key + " · " + r.name) + "</option>").join("");
  $("row").addEventListener("change", () => { fillBays(); render(); });
  $("bay").addEventListener("change", render);
  $("mode").addEventListener("change", render);
  $("size").addEventListener("change", render);
  fillBays();
}
function fillBays() {
  const k = $("row").value;
  const row = rowsOf().find((r) => r.key === k);
  const max = row ? row.bays : Math.max(...rowsOf().map((r) => r.bays));
  let html = '<option value="">ทุกล็อก</option>';
  for (let b = 1; b <= max; b++) html += '<option value="' + b + '">ล็อก ' + b + "</option>";
  $("bay").innerHTML = html;
}

/** ป้ายที่จะพิมพ์ตามตัวกรอง */
function labels() {
  const rk = $("row").value, bay = Number($("bay").value) || 0, mode = $("mode").value;
  let list = LAYOUT.slots.filter((s) => (!rk || s.row === rk) && (!bay || s.bay === bay));
  if (mode === "cell") {
    /* ป้ายต่อช่องชั้น = เอาด้านซ้ายเป็นตัวแทน แล้วพิมพ์รหัสโดยไม่มีฝั่ง */
    list = list.filter((s) => s.side === LAYOUT.sides[0]);
    return list.map((s) => ({ code: s.location, title: s.location, sub: labelName(s, true) }));
  }
  return list.map((s) => ({ code: s.slot, title: s.slot, sub: labelName(s, false) }));
}

/* 🔑 ใช้ชื่อที่ผังส่งมา ไม่เรียงคำเอง
   🪤 เดิมหน้านี้เรียง "ล็อก…ชั้น…" เอง ⇒ พอรหัสสลับเป็น ชั้นก่อนล็อก
      บนป้ายใบเดียวกันเลยอ่านรหัสกับอ่านคำได้คนละลำดับ สับสนตอนหาของ */
function labelName(s, noSide) {
  const base = String(s.label || "").replace(/\s*\(ฝั่ง[^)]*\)\s*$/, "");
  if (noSide) return base;
  return base + " · ฝั่ง" + (s.side === "L" ? "ซ้าย" : "ขวา");
}

/** แท่งบาร์โค้ดบางสุดที่จะได้บนกระดาษจริง (มม.) — ต่ำกว่า 0.19 มม. เครื่องยิงอ่านยาก */
function moduleMm(s, sample) {
  const chars = String(sample || "").length;
  const modules = 11 + chars * 11 + 11 + 13 + 20;         // start + ข้อมูล + check + stop + ขอบเงียบ
  const inner = labelW(s) - 5 - s.qr - 2;                 // กว้างป้าย − ขอบ − QR − ช่องไฟ
  return inner / modules;
}

function render() {
  applySize();
  const list = labels(), s = sizeNow(), per = perSheet(s);
  const mm = list.length ? moduleMm(s, list[0].code) : 0;
  $("note").innerHTML = "จะพิมพ์ <b>" + list.length + " ป้าย</b> — A4 แนวตั้ง " + s.cols +
    " ป้าย/แถว · " + per + " ป้าย/แผ่น ⇒ <b>" + Math.ceil(list.length / per) + " แผ่น</b>" +
    "<br>ป้ายขนาด " + labelW(s).toFixed(0) + " × " + s.lh + " มม. · แท่งบาร์โค้ดบางสุด ≈ " +
    mm.toFixed(2) + " มม." +
    (mm < 0.19
      ? ' <b style="color:#b91c1c">(เล็กเกินสำหรับเครื่องยิงบาร์โค้ด — ลองแล้วอ่านไม่ออกจริง ' +
        "ขนาดนี้ใช้ได้เฉพาะสแกน QR ด้วยมือถือ)</b>"
      : " (เครื่องยิงอ่านได้สบาย — ไม่ควรต่ำกว่า 0.19 มม.)") +
    "<br>▌▌▌ บาร์โค้ด = เครื่องยิง · ▓▓▓ QR = กล้องมือถือ — เก็บรหัสช่องเหมือนกันทั้งคู่ " +
    "ยิง/สแกนที่หน้า “ยิงรับเข้าชั้น” แล้วระบบจะจำช่องนั้นให้ทันที";
  if (!list.length) { $("sheet").innerHTML = '<div class="empty">ไม่มีป้ายตามตัวกรองนี้</div>'; return; }

  $("sheet").innerHTML = '<div class="grid">' + list.map((l, i) =>
    '<div class="lbl"><div class="zone">' + esc(l.sub) + "</div>" +
    '<div class="code">' + esc(l.title) + "</div>" +
    '<div class="marks"><div class="bc"><svg id="bc' + i + '"></svg></div>' +
    '<div class="qr" id="qr' + i + '"></div></div>' +
    '<div class="foot">โกดัง Pacred · สมุทรสาคร</div></div>').join("") + "</div>";

  /* วาดบาร์โค้ด + QR — ล้มทีละอันไม่ทำให้ทั้งแผ่นพัง */
  list.forEach((l, i) => {
    try {
      /* 🔑 ขอบเงียบ 10 แท่งซ้าย-ขวา (มาตรฐาน Code128) — ไม่มีขอบเงียบ เครื่องยิงอ่านไม่ติด
         width:2 ⇒ margin 20px = 10 แท่งพอดี และตรงกับที่ moduleMm() คิดไว้ */
      window.JsBarcode("#bc" + i, l.code, {
        format: "CODE128", displayValue: false, height: 60, width: 2,
        marginTop: 0, marginBottom: 0, marginLeft: 20, marginRight: 20,
      });
    } catch {
      const n = $("bc" + i);
      if (n) n.outerHTML = '<div class="bad">วาดบาร์โค้ดไม่ได้</div>';
    }
    try {
      /* 🔒 QR เก็บ "รหัสช่อง" เฉยๆ — ไม่ใส่ลิงก์/กุญแจ ป้ายหลุดไปก็เปิดระบบไม่ได้ */
      const q = window.qrcode(0, "M");
      q.addData(l.code);
      q.make();
      /* margin 4 ช่อง = ขอบเงียบตามมาตรฐาน QR — ไม่มีขอบเงียบ กล้องมือถืออ่านไม่ติด */
      $("qr" + i).innerHTML = q.createSvgTag({ cellSize: 2, margin: 8, scalable: true });
    } catch {
      const n = $("qr" + i);
      if (n) n.innerHTML = '<div class="bad">QR ไม่ได้</div>';
    }
  });
}

$("print").addEventListener("click", () => window.print());

(async () => {
  const r = await fetch(api("/warehouse/api/layout"));
  if (!r.ok) {
    $("sheet").innerHTML = '<div class="empty">เปิดหน้านี้ไม่ได้ — ' +
      esc((await r.json().catch(() => ({}))).error || r.status) + "</div>";
    return;
  }
  LAYOUT = await r.json();
  const miss = [!window.JsBarcode && "บาร์โค้ด", !window.qrcode && "QR"].filter(Boolean);
  if (miss.length) {
    $("sheet").innerHTML = '<div class="empty">โหลดตัววาด' + miss.join(" + ") +
      " ไม่ได้ — ต้องต่อเน็ตตอนเปิดหน้านี้ครั้งแรก</div>";
    return;
  }
  fillPickers();
  render();
})().catch((e) => { $("sheet").innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + esc(e.message) + "</div>"; });
</script>
</body>
</html>
